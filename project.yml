name: Lighty

options:
  bundleIdPrefix: com.hrdcoreee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Liquid Glass needs the iOS 26 SDK to compile, but the app still runs on
    # iOS 16: availability checks pick the material at runtime. Building with
    # an older SDK is a hard error ("cannot find 'glassEffect' in scope"), which
    # is why CI selects Xcode 26 explicitly.
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Lighty:
    type: application
    platform: iOS
    sources:
      - path: Lighty
    settings:
      base:
        PRODUCT_NAME: Lighty
        PRODUCT_BUNDLE_IDENTIFIER: com.hrdcoreee.lighty
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/Lighty.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The glass shim is the only Objective-C in the target; it exists
        # because private Core Animation selectors take struct arguments that
        # Swift cannot express through `@convention(c)`.
        SWIFT_OBJC_BRIDGING_HEADER: Lighty/Theme/Glass/Lighty-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Lighty/Theme/Glass
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  LightyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LightyTests
    dependencies:
      - target: Lighty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrdcoreee.lighty.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lighty.app/Lighty"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Lighty:
    build:
      targets:
        Lighty: all
        LightyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LightyTests
    archive:
      config: Release
