name: iOS build

on:
  push:
    branches: [main, solarium]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Device build + IPA
    runs-on: macos-15
    timeout-minutes: 40

    env:
      SCHEME: Lighty
      PROJECT: Lighty.xcodeproj
      APP_NAME: Lighty

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Liquid Glass (`glassEffect`) is declared in the iOS 26 SDK and is a
      # compile error without it. The deployment target stays 16.0; availability
      # checks pick the material at runtime.
      - name: Select Xcode
        run: |
          # Runner images keep several Xcode bundles side by side and the
          # default one may not ship an iOS 26 SDK, so pick the highest bundle
          # that actually reports an iOS SDK 26 or newer.
          BEST=""
          BEST_MAJOR=0
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            SDK=$(DEVELOPER_DIR="$APP/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 0)
            MAJOR=${SDK%%.*}
            [ -n "$MAJOR" ] || MAJOR=0
            echo "$APP -> iOS SDK $SDK"
            if [ "$MAJOR" -ge 26 ] && [ "$MAJOR" -gt "$BEST_MAJOR" ]; then
              BEST="$APP"
              BEST_MAJOR="$MAJOR"
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No Xcode with an iOS 26 SDK on this runner; Liquid Glass cannot compile"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$BEST/Contents/Developer"
          echo "Using $BEST"

      - name: Report toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project "$PROJECT"

      # ---------------------------------------------------------------------
      # The artefact that matters for the BLE proof of concept: an arm64
      # Release build against the iphoneos SDK. This validates the device
      # compile and bakes in the `bluetooth-central` background mode.
      # ---------------------------------------------------------------------
      - name: Build for device (Release, unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log

      - name: Locate app bundle
        id: app
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' || true
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found $APP"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$APP/Info.plist" || true

      # ---------------------------------------------------------------------
      # Ad-hoc signing for jailbreak / sideload-only test devices.
      #
      # `codesign -d --entitlements :-` prints a leading `Executable=...`
      # diagnostic line before the XML, so the XML is extracted before it is
      # fed to plutil.
      # ---------------------------------------------------------------------
      - name: Ad-hoc sign and inspect entitlements
        id: sign
        continue-on-error: true
        run: |
          APP='${{ steps.app.outputs.app }}'

          extract_entitlements() {
            codesign -d --entitlements :- "$1" 2>&1 | sed -n '/<?xml/,/<\/plist>/p'
          }

          codesign --force --sign - --entitlements Config/Lighty.entitlements "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee codesign-info.txt || true

          extract_entitlements "$APP" > app-entitlements.plist
          if [ -s app-entitlements.plist ]; then
            plutil -convert xml1 app-entitlements.plist
            plutil -p app-entitlements.plist
          else
            echo "No entitlements embedded (expected without a provisioning profile)." \
              | tee app-entitlements.plist
          fi

      - name: Package IPA
        id: ipa
        continue-on-error: true
        run: |
          APP='${{ steps.app.outputs.app }}'
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload "${APP_NAME}.ipa"
          ls -lh "${APP_NAME}.ipa"
          echo "ipa=${APP_NAME}.ipa" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Artifacts. Always uploaded so a failing run still leaves the log that
      # explains the first real `error:` line, not just `exit code 65`.
      # ---------------------------------------------------------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            xcodebuild.log
            codesign-info.txt
            *-entitlements.plist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IPA
        if: always() && steps.ipa.outputs.ipa != ''
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ steps.ipa.outputs.ipa }}
          if-no-files-found: warn
          retention-days: 14

      # Signing and IPA packaging are diagnostics on the jailbreak path; only a
      # real build failure should turn the job red.
      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS build"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Device build | ${{ steps.build.outcome }} |"
            echo "| Locate app bundle | ${{ steps.app.outcome }} |"
            echo "| Ad-hoc signing | ${{ steps.sign.outcome }} |"
            echo "| IPA packaging | ${{ steps.ipa.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
