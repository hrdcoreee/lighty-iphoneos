name: iOS unit tests

# Manual only. The build workflow is the one that gates a push; these tests
# cover the hardware-independent logic and need an iOS Simulator, which is
# optional for this proof of concept.
on:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      SCHEME: Lighty
      PROJECT: Lighty.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # CI helper logic is plain Python so it can be unit tested without macOS.
      # ---------------------------------------------------------------------
      - name: Test CI helper scripts
        id: helpers
        run: python3 Scripts/test_pick_simulator.py

      # Liquid Glass (`glassEffect`) is declared in the iOS 26 SDK and is a
      # compile error without it. The deployment target stays 16.0; availability
      # checks pick the material at runtime.
      - name: Select Xcode
        run: |
          # Runner images keep several Xcode bundles side by side and the
          # default one may not ship an iOS 26 SDK, so pick the highest bundle
          # that actually reports an iOS SDK 26 or newer.
          BEST=""
          BEST_MAJOR=0
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            SDK=$(DEVELOPER_DIR="$APP/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 0)
            MAJOR=${SDK%%.*}
            [ -n "$MAJOR" ] || MAJOR=0
            echo "$APP -> iOS SDK $SDK"
            if [ "$MAJOR" -ge 26 ] && [ "$MAJOR" -gt "$BEST_MAJOR" ]; then
              BEST="$APP"
              BEST_MAJOR="$MAJOR"
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No Xcode with an iOS 26 SDK on this runner; Liquid Glass cannot compile"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$BEST/Contents/Developer"
          echo "Using $BEST"

      - name: Report toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # A hardcoded `name=iPhone 16` breaks as soon as a runner image drops that
      # device, so the destination is resolved from the machine itself.
      - name: Pick a simulator destination
        id: sim
        run: |
          set -eu
          UDID=$(xcrun simctl list devices available -j | python3 Scripts/pick_simulator.py)
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      # Covers the pure logic: ELK frame encoding, HSV -> RGB, scan filtering
      # and version comparison. No Bluetooth hardware required.
      - name: Run unit tests (simulator)
        id: test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination '${{ steps.sim.outputs.destination }}' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS unit tests"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| CI helper scripts | ${{ steps.helpers.outcome }} |"
            echo "| Unit tests (simulator) | ${{ steps.test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
